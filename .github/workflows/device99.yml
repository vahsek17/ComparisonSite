name: PyScrape->Groq->Firebase

on:
  workflow_dispatch:
    inputs:
      specs_url:
        description: "Please enter the specs URL to scrape"
        required: true
        type: string

jobs:
  process:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # -----------------------------
      # PYTHON SETUP
      # -----------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install cloudscraper lxml

      # -----------------------------
      # RUN SCRAPER
      # -----------------------------
      - name: Run scraper
        id: scraper
        run: |
          python app/components/scraper.py "${{ github.event.inputs.specs_url }}" > scraped.json

          echo "===== SCRAPED DATA ====="
          cat scraped.json

      # -----------------------------
      # GROQ TRANSFORMATION
      # -----------------------------
      - name: Gemini Call
        run: |

          DATA=$(cat scraped.json)

          REQUEST=$(jq -n \
          --arg data "$DATA" \
          '{
            contents: [
              {
                parts: [
                  {
                    text: (
                      "STRICT_MODE=TRUE; Analyse the data for this mobile very carefully. DATA: "
                      + $data +
                      " After analyzing the device data, generate Firestore REST JSON ONLY, exactly ONE JSON object in ONE single paragraph with NO line breaks, with ROOT key `fields`; EVERY field MUST use google.firestore.v1.Value wrappers (stringValue); NEVER omit keys, NEVER repeat keys, estimate values if unsure, and return ONLY the final Firestore-compatible JSON object."
                    )
                  }
                ]
              }
            ]
          }')

          echo "===== REQUEST GENERATED ====="
          echo "$REQUEST" | jq .

          RESPONSE_1=$(curl -s -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${{ secrets.GEMINI_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "$REQUEST")

          echo "===== RAW GEMINI RESPONSE ====="
          echo "$RESPONSE_1"

          echo "===== FORMATTED GEMINI RESPONSE ====="
          echo "$RESPONSE_1" | jq .

          CONTENT=$(echo "$RESPONSE_1" \
            | jq -r '.candidates[0].content.parts[0].text // empty')

          if [ -z "$CONTENT" ]; then
            echo "Gemini returned empty response"
            exit 1
          fi

          # Remove markdown wrapping if Gemini returns ```json
          CONTENT=$(echo "$CONTENT" | sed 's/^```json//')
          CONTENT=$(echo "$CONTENT" | sed 's/^```//')
          CONTENT=$(echo "$CONTENT" | sed 's/```$//')

          echo "$CONTENT" > mobileData.json

          echo "===== BASE JSON ====="
          cat mobileData.json

          echo "===== VALIDATING JSON ====="
          jq empty mobileData.json || exit 1
      

          
      # -----------------------------
      # AUTHENTICATE GCP
      # -----------------------------
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          token_format: access_token

      # -----------------------------
      # GENERATE DOC ID
      # -----------------------------
      - name: Generate document id
        id: doc
        run: |
          URL="${{ github.event.inputs.specs_url }}"
          DOC=$(basename "$URL" | cut -d'-' -f1-3)
          DOC_ID=$(echo "$DOC" | sed 's/ /%20/g')
          echo "doc_id=$DOC_ID" >> $GITHUB_OUTPUT

      # -----------------------------
      # UPLOAD TO FIRESTORE
      # -----------------------------
      - name: Upload to Firestore
        run: |
          curl -s -w "\nHTTP %{http_code}\n" \
            -X PATCH \
            "https://firestore.googleapis.com/v1/projects/site-9686c/databases/(default)/documents/${{ github.ref_name }}/${{ steps.doc.outputs.doc_id }}" \
            -H "Authorization: Bearer ${{ steps.auth.outputs.access_token }}" \
            -H "Content-Type: application/json" \
            --data-binary @mobileData.json
